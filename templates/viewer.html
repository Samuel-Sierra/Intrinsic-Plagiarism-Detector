<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Viewer</title>
    <link rel="stylesheet" href="static/stile2.css">
</head>
<body>

    <div class="viewer-container">
        <header class="viewer-header">
            <div class="header-left">
                <button class="back-btn" aria-label="Volver" onclick="window.location.href='/'">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                </button>
                <div class="header-titles">
                    <h2>Document Viewer</h2>
                    <span class="document-type">Text Document</span>
                </div>
            </div>
            
            <button class="download-btn" id="downloadBtn">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                Download
            </button>
        </header>

        <main class="viewer-content">
            <div class="content-title">
                <svg class="doc-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                    <polyline points="10 9 9 9 8 9"></polyline>
                </svg>
                <span>Text Content</span>
            </div>

            <div class="text-display-box" id="textDisplayBox">
            </div>
        </main>
    </div>

    <script>
        document.getElementById("textDisplayBox").innerHTML = `{{ texto_resaltado_html | safe }}`;
        const pdfBase64 = "{{ pdf_base64 }}";

        document.getElementById("downloadBtn").addEventListener("click", () => {
            if (!pdfBase64) {
                alert("El archivo PDF aún no está listo o es inválido.");
                return;
            }

            const byteCharacters = atob(pdfBase64);
            const byteNumbers = new Array(byteCharacters.length);
            for (let i = 0; i < byteCharacters.length; i++) {
                byteNumbers[i] = byteCharacters.charCodeAt(i);
            }
            const byteArray = new Uint8Array(byteNumbers);
            const blob = new Blob([byteArray], { type: "application/pdf" });

            const url = window.URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.style.display = "none";
            a.href = url;
            a.download = "reporte_analisis_plagio.pdf";
            
            document.body.appendChild(a);
            a.click();
            
            // Limpieza de memoria del navegador
            window.URL.revokeObjectURL(url);
            a.remove();
        });
    </script>
</body>
</html>
